name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    # Markdown checks have a fifteen-minute cap: a job still running then
    # has hung rather than failed.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          version: v0.38.2
          driver: docker

      - name: Run source checks
        run: make check
