name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    # Source checks have a fifteen-minute cap: a job still running then
    # has hung rather than failed.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3

      - name: Run source checks
        shell: bash
        run: |
          set -euo pipefail
          source tests/container/stock
          stock_begin "$PWD"
          stock_image shellcheck_image koalaman/shellcheck:v0.11.0
          stock_readonly "${shellcheck_image}" /bin/shellcheck -x -P SCRIPTDIR \
            tests/container/stock tests/container/check-stock tests/container/markdown
          stock_image node_image node:24.22.2
          STOCK_NETWORK=bridge stock_run "${node_image}" -- sh tests/container/markdown
          stock_finish
